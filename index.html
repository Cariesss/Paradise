<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сборщик квоты — Эра Парадиз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            transition: background 0.5s;
        }

        h1 {
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366;
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: 4px;
            transition: all 0.5s;
        }

        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 20px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #gameCanvas {
            border: 3px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            background: #111;
            display: block;
            transition: all 0.5s;
        }

        .info {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            margin-top: 15px;
            font-size: 16px;
            transition: all 0.5s;
        }

        .info span {
            color: #ffaa00;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid #ff3366;
            padding: 30px 50px;
            color: #ff3366;
            font-size: 20px;
            text-align: center;
            z-index: 100;
            display: none;
            box-shadow: 0 0 40px #ff3366;
            max-width: 600px;
        }

        #message button {
            margin-top: 20px;
            background: #111;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        #message button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }

        .controls {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
            text-align: center;
        }

        /* === СКРИМЕР === */
        #jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #jumpscareCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #emperorText {
            position: relative;
            z-index: 10000;
            color: #ff0000;
            font-size: 22px;
            text-align: center;
            max-width: 800px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 1s;
        }

        #emperorText .emperor-name {
            color: #ff3366;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 30px;
            display: block;
            text-shadow: 0 0 30px #ff3366;
        }

        /* Кровавый экран */
        .blood-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 0%, rgba(255, 0, 0, 0.3) 50%, rgba(139, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 9998;
            display: none;
        }

        .blood-drip {
            position: fixed;
            top: 0;
            width: 3px;
            background: linear-gradient(to bottom, #8b0000, #ff0000);
            z-index: 9997;
            display: none;
            animation: drip 3s linear infinite;
        }

        @keyframes drip {
            0% { height: 0; opacity: 1; }
            100% { height: 100vh; opacity: 0; }
        }
    </style>
</head>
<body>

<h1 id="mainTitle">🎮 СБОРЩИК КВОТЫ</h1>
<div class="subtitle" id="mainSubtitle">[ Выполни ежедневную квоту — или исчезни ]</div>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<div class="info">
    <div>Собрано: <span id="score">0</span> / <span id="goal">10</span></div>
    <div>Уровень: <span id="level">1</span></div>
    <div>Жизни: <span id="lives">❤️❤️❤️</span></div>
</div>

<div class="controls">
    Управление: ← → ↑ ↓ или WASD &nbsp; | &nbsp; Собирай зелёные яблоки, избегай красных токсинов
</div>

<div id="message">
    <div id="messageText"></div>
    <button onclick="closeMessage()">Продолжить</button>
</div>

<!-- === КРОВАВЫЙ ЭКРАН === -->
<div class="blood-overlay" id="bloodOverlay"></div>

<!-- === СКРИМЕР С ИМПЕРАТОРОМ === -->
<div id="jumpscare">
    <canvas id="jumpscareCanvas"></canvas>
    <div id="emperorText"></div>
</div>

<script>
    // === НАСТРОЙКИ ===
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 800;
    const HEIGHT = 500;

    // Игрок
    const player = {
        x: WIDTH / 2,
        y: HEIGHT / 2,
        size: 20,
        speed: 5,
        color: '#00ffcc'
    };

    // Игровые объекты
    let apples = [];
    let toxins = [];
    let particles = [];

    // Состояние игры
    let score = 0;
    let goal = 10;
    let level = 1;
    let lives = 3;
    let gameRunning = true;
    let jumpscareShown = false;
    let emperorStage = 0;

    // Клавиши
    const keys = {};

    document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
            e.preventDefault();
        }
    });

    document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    // === СОЗДАНИЕ ОБЪЕКТОВ ===
    function spawnApple() {
        apples.push({
            x: Math.random() * (WIDTH - 30) + 15,
            y: Math.random() * (HEIGHT - 30) + 15,
            size: 12,
            color: '#00ff66'
        });
    }

    function spawnToxin() {
        toxins.push({
            x: Math.random() * (WIDTH - 30) + 15,
            y: Math.random() * (HEIGHT - 30) + 15,
            size: 14,
            color: '#ff3366',
            speed: 1 + level * 0.3,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2
        });
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                size: Math.random() * 4 + 2,
                color: color,
                life: 30
            });
        }
    }

    // === ОБНОВЛЕНИЕ ===
    function update() {
        if (!gameRunning) return;

        if (keys['arrowup'] || keys['w']) player.y -= player.speed;
        if (keys['arrowdown'] || keys['s']) player.y += player.speed;
        if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
        if (keys['arrowright'] || keys['d']) player.x += player.speed;

        player.x = Math.max(player.size, Math.min(WIDTH - player.size, player.x));
        player.y = Math.max(player.size, Math.min(HEIGHT - player.size, player.y));

        apples.forEach((apple, i) => {
            const dx = player.x - apple.x;
            const dy = player.y - apple.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < player.size + apple.size) {
                apples.splice(i, 1);
                score++;
                document.getElementById('score').textContent = score;
                spawnParticles(apple.x, apple.y, '#00ff66');
                spawnApple();

                if (score >= goal) {
                    levelUp();
                }
            }
        });

        toxins.forEach((toxin, i) => {
            toxin.x += toxin.vx;
            toxin.y += toxin.vy;

            if (toxin.x < toxin.size || toxin.x > WIDTH - toxin.size) toxin.vx *= -1;
            if (toxin.y < toxin.size || toxin.y > HEIGHT - toxin.size) toxin.vy *= -1;

            const dx = player.x - toxin.x;
            const dy = player.y - toxin.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < player.size + toxin.size) {
                lives--;
                document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives));
                spawnParticles(player.x, player.y, '#ff3366');
                toxins.splice(i, 1);
                spawnToxin();

                if (lives <= 0) {
                    gameOver();
                }
            }
        });

        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        });
    }

    function levelUp() {
        level++;
        score = 0;
        goal = Math.floor(goal * 1.3);

        document.getElementById('level').textContent = level;
        document.getElementById('score').textContent = score;
        document.getElementById('goal').textContent = goal;

        for (let i = 0; i < 2; i++) {
            spawnToxin();
        }

        // === УРОВЕНЬ 13 — СКРИМЕР С ИМПЕРАТОРОМ ===
        if (level === 13 && !jumpscareShown) {
            jumpscareShown = true;
            triggerJumpscare();
        }
    }

    function gameOver() {
        gameRunning = false;
        showMessage(
            '💀 КВОТА НЕ ВЫПОЛНЕНА 💀<br><br>' +
            'Ты исчез, как и многие до тебя.<br>' +
            'Но помни: остров не отпускает просто так.<br><br>' +
            'Попробуй снова.'
        );

        document.getElementById('message').querySelector('button').textContent = 'Начать заново';
        document.getElementById('message').querySelector('button').onclick = resetGame;
    }

    function showMessage(text) {
        document.getElementById('messageText').innerHTML = text;
        document.getElementById('message').style.display = 'block';
        gameRunning = false;
    }

    function closeMessage() {
        document.getElementById('message').style.display = 'none';
        gameRunning = true;
    }

    function resetGame() {
        score = 0;
        level = 1;
        lives = 3;
        goal = 10;
        jumpscareShown = false;
        emperorStage = 0;
        apples = [];
        toxins = [];
        particles = [];
        player.x = WIDTH / 2;
        player.y = HEIGHT / 2;

        // Возвращаем нормальные цвета
        document.body.style.background = '#0a0a0a';
        document.getElementById('mainTitle').style.color = '#ff3366';
        document.getElementById('mainTitle').style.textShadow = '0 0 10px #ff3366';
        document.getElementById('gameCanvas').style.borderColor = '#00ffcc';
        document.getElementById('gameCanvas').style.boxShadow = '0 0 30px rgba(0, 255, 204, 0.3)';
        document.getElementById('bloodOverlay').style.display = 'none';
        document.getElementById('jumpscare').style.display = 'none';

        document.getElementById('score').textContent = score;
        document.getElementById('goal').textContent = goal;
        document.getElementById('level').textContent = level;
        document.getElementById('lives').textContent = '❤️❤️❤️';

        for (let i = 0; i < 3; i++) spawnApple();
        for (let i = 0; i < 2; i++) spawnToxin();

        document.getElementById('message').style.display = 'none';
        document.getElementById('message').querySelector('button').textContent = 'Продолжить';
        document.getElementById('message').querySelector('button').onclick = closeMessage;

        gameRunning = true;
    }

    // === СКРИМЕР ===
    function triggerJumpscare() {
        gameRunning = false;

        // Кровавый экран
        document.getElementById('bloodOverlay').style.display = 'block';

        // Скачок в темноту
        document.body.style.background = '#1a0000';
        document.getElementById('mainTitle').style.color = '#8b0000';
        document.getElementById('mainTitle').style.textShadow = '0 0 20px #8b0000';
        document.getElementById('gameCanvas').style.borderColor = '#8b0000';
        document.getElementById('gameCanvas').style.boxShadow = '0 0 50px #8b0000';

        // Громкий звук (через Web Audio API)
        playScreamSound();

        // Показываем скример
        const jumpscare = document.getElementById('jumpscare');
        jumpscare.style.display = 'flex';

        // Рисуем Императора на canvas
        drawEmperor();

        // Затемнение
        setTimeout(() => {
            const text = document.getElementById('emperorText');
            text.style.opacity = '1';

            // Этап 1 — имя
            emperorStage = 1;
            text.innerHTML = '<span class="emperor-name">ИМПЕРАТОР</span>';

            // Этап 2 — первая фраза
            setTimeout(() => {
                emperorStage = 2;
                text.innerHTML = '<span class="emperor-name">ИМПЕРАТОР</span>' +
                    '«Слишком много времени пройдёт с осознания своей недолготы.»';
            }, 3000);

            // Этап 3 — поворот на камеру
            setTimeout(() => {
                emperorStage = 3;
                drawEmperorTurned();
            }, 5500);

            // Этап 4 — финальные слова
            setTimeout(() => {
                emperorStage = 4;
                text.innerHTML = '<span class="emperor-name">ИМПЕРАТОР</span>' +
                    '«Мозги на вынос, летит всё в щепки.<br>' +
                    'Зло внутри, добро царит.»<br><br>' +
                    '«Но вы конечно странные существа<br>' +
                    'в изотерике радиации.<br>' +
                    'Надышавшись газом<br>' +
                    'не спасти умирающую тушу.»';
            }, 8000);

            // Этап 5 — исчезновение
            setTimeout(() => {
                jumpscare.style.display = 'none';
                document.getElementById('bloodOverlay').style.display = 'none';
                document.body.style.background = '#0a0a0a';
                document.getElementById('gameCanvas').style.borderColor = '#00ffcc';
                document.getElementById('gameCanvas').style.boxShadow = '0 0 30px rgba(0, 255, 204, 0.3)';
                document.getElementById('mainTitle').style.color = '#ff3366';
                document.getElementById('mainTitle').style.textShadow = '0 0 10px #ff3366';

                // Продолжаем игру
                gameRunning = true;
            }, 15000);

        }, 500);
    }

    // === ЗВУК КРИКА ===
    function playScreamSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Низкий гул
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 2);
            gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 2);

            // Высокий скрежет
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 1.5);
            gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 1.5);
        } catch (e) {
            console.log('Звук не сработал:', e);
        }
    }

    // === РИСУЕМ ИМПЕРАТОРА (ЛЕТАЮЩИЙ, В КОСТЯХ) ===
    function drawEmperor(turned = false) {
        const jc = document.getElementById('jumpscareCanvas');
        const jctx = jc.getContext('2d');

        jc.width = window.innerWidth;
        jc.height = window.innerHeight;

        const cx = jc.width / 2;
        const cy = jc.height / 2;

        // Кровавый фон
        jctx.fillStyle = '#000';
        jctx.fillRect(0, 0, jc.width, jc.height);

        // Красное свечение
        const gradient = jctx.createRadialGradient(cx, cy, 50, cx, cy, 500);
        gradient.addColorStop(0, 'rgba(139, 0, 0, 0.8)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 1)');
        jctx.fillStyle = gradient;
        jctx.fillRect(0, 0, jc.width, jc.height);

        // === ТЕЛО ИМПЕРАТОРА ===
        jctx.save();
        jctx.translate(cx, cy);

        // Парение (лёгкое покачивание)
        const float = Math.sin(Date.now() / 500) * 10;

        // Мантия (тёмная, рваная)
        jctx.fillStyle = '#1a0000';
        jctx.beginPath();
        jctx.moveTo(-120, 100 + float);
        jctx.lineTo(-80, -100 + float);
        jctx.lineTo(0, -150 + float);
        jctx.lineTo(80, -100 + float);
        jctx.lineTo(120, 100 + float);
        jctx.lineTo(0, 150 + float);
        jctx.closePath();
        jctx.fill();

        // Кости на мантии
        jctx.strokeStyle = '#e8e8e8';
        jctx.lineWidth = 4;

        // Рёбра
        for (let i = 0; i < 5; i++) {
            const y = -80 + i * 40 + float;
            jctx.beginPath();
            jctx.moveTo(-60 + i * 5, y);
            jctx.quadraticCurveTo(0, y + 20, 60 - i * 5, y);
            jctx.stroke();
        }

        // Череп (лицо)
        jctx.fillStyle = '#e8e8e8';
        jctx.beginPath();
        jctx.arc(0, -120 + float, 45, 0, Math.PI * 2);
        jctx.fill();

        // Глазницы
        jctx.fillStyle = '#000';
        jctx.beginPath();
        jctx.arc(-18, -130 + float, 12, 0, Math.PI * 2);
        jctx.arc(18, -130 + float, 12, 0, Math.PI * 2);
        jctx.fill();

        // Красные глаза (свечение)
        jctx.fillStyle = '#ff0000';
        jctx.shadowColor = '#ff0000';
        jctx.shadowBlur = 20;
        jctx.beginPath();
        jctx.arc(-18, -130 + float, 6, 0, Math.PI * 2);
        jctx.arc(18, -130 + float, 6, 0, Math.PI * 2);
        jctx.fill();
        jctx.shadowBlur = 0;

        // Челюсть
        jctx.strokeStyle = '#e8e8e8';
        jctx.lineWidth = 3;
        jctx.beginPath();
        jctx.moveTo(-20, -95 + float);
        jctx.lineTo(-15, -75 + float);
        jctx.lineTo(15, -75 + float);
        jctx.lineTo(20, -95 + float);
        jctx.stroke();

        // Зубы
        for (let i = -15; i <= 15; i += 8) {
            jctx.beginPath();
            jctx.moveTo(i, -80 + float);
            jctx.lineTo(i, -70 + float);
            jctx.stroke();
        }

        // Костлявые руки
        jctx.strokeStyle = '#e8e8e8';
        jctx.lineWidth = 5;

        // Левая рука
        jctx.beginPath();
        jctx.moveTo(-80, -50 + float);
        jctx.lineTo(-150, 0 + float);
        jctx.lineTo(-180, 50 + float);
        jctx.stroke();

        // Правая рука
        jctx.beginPath();
        jctx.moveTo(80, -50 + float);
        jctx.lineTo(150, 0 + float);
        jctx.lineTo(180, 50 + float);
        jctx.stroke();

        // Пальцы (костяные)
        for (let side of [-1, 1]) {
            for (let i = 0; i < 3; i++) {
                jctx.beginPath();
                jctx.moveTo(side * 180, 50 + float);
                jctx.lineTo(side * (180 + i * 15), 80 + i * 10 + float);
                jctx.stroke();
            }
        }

        // === ПОВОРОТ НА КАМЕРУ (на этапе 3) ===
        if (turned) {
            // Красные глаза становятся ярче
            jctx.fillStyle = '#ff0000';
            jctx.shadowColor = '#ff0000';
            jctx.shadowBlur = 40;
            jctx.beginPath();
            jctx.arc(-18, -130 + float, 10, 0, Math.PI * 2);
            jctx.arc(18, -130 + float, 10, 0, Math.PI * 2);
            jctx.fill();
            jctx.shadowBlur = 0;

            // Кровавые слёзы
            jctx.strokeStyle = '#8b0000';
            jctx.lineWidth = 3;
            jctx.beginPath();
            jctx.moveTo(-18, -120 + float);
            jctx.lineTo(-18, -80 + float);
            jctx.moveTo(18, -120 + float);
            jctx.lineTo(18, -80 + float);
            jctx.stroke();
        }

        jctx.restore();
    }

    function drawEmperorTurned() {
        drawEmperor(true);
    }

    // === ОТРИСОВКА ИГРЫ ===
    function draw() {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1;
        for (let x = 0; x < WIDTH; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, HEIGHT);
            ctx.stroke();
        }
        for (let y = 0; y < HEIGHT; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(WIDTH, y);
            ctx.stroke();
        }

        apples.forEach(apple => {
            ctx.fillStyle = apple.color;
            ctx.shadowColor = apple.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(apple.x, apple.y, apple.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        toxins.forEach(toxin => {
            ctx.fillStyle = toxin.color;
            ctx.shadowColor = toxin.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(toxin.x, toxin.y, toxin.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 30;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        ctx.fillStyle = player.color;
        ctx.shadowColor = player.color;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = player.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size + 5, 0, Math.PI * 2);
        ctx.stroke();
    }

    // === ИГРОВОЙ ЦИКЛ ===
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // === СТАРТ ===
    resetGame();
    gameLoop();
</script>
</body>
</html>
